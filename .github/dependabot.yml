version: 2
updates:
  # 1. Monitorear dependencias de Python (requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily" # Revisa a diario para que la evidencia aparezca rápido
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"

  # 2. Monitorear la imagen base del Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"